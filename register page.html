<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Expo - Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("img 1.jpg");
    background-size:cover;
    background-position:center;
}

/* Form Container */

.container{
    width:400px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    color:white;
}

.container h1{
    text-align:center;
    margin-bottom:25px;
    color:#4CAF50;
}

/* Labels */

label{
    display:block;
    margin-bottom:5px;
    margin-top:12px;
    font-weight:500;
}

/* Inputs */

input[type="text"],
input[type="email"],
input[type="password"]{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    margin-bottom:10px;
}

/* Checkbox */

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.checkbox label{
    margin:0;
}

/* Button */

button{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

button:hover{
    background:#45a049;
    transform:translateY(-3px);
}

/* Login Link */

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#4CAF50;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}

/* Mobile Responsive */

@media(max-width:500px){

    .container{
        width:90%;
        padding:25px;
    }

    .container h1{
        font-size:28px;
    }
}

</style>
</head>

<body>

<form class="container" action="login page.html" method="post">

    <h1>Register</h1>

    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter username" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter email address" required>

    <label for="pwd">Create Password</label>
    <input type="password" id="pwd" name="pwd" placeholder="Create password" required>

    <label for="cpwd">Confirm Password</label>
    <input type="password" id="cpwd" name="cpwd" placeholder="Confirm password" required>

    <div class="checkbox">
        <input type="checkbox" id="terms" required>
        <label for="terms">I accept all Terms & Conditions</label>
    </div>

    <button type="submit">Register Now</button>

    <div class="login-link">
        Already have an account?
        <a href="login page.html">Login Now</a>
    </div>

</form>

</body>
</html>
