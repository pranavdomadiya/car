<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Car Expo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("car 2.jpg");
    background-size:cover;
    background-position:center;
}

/* Login Card */

.container{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:white;
}

/* Heading */

.container h1{
    text-align:center;
    margin-bottom:30px;
    color:#4CAF50;
}

/* Form */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

.form-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
}

/* Remember Me */

.remember{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

/* Button */

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#45a049;
    transform:translateY(-2px);
}

/* Register Link */

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#4CAF50;
    text-decoration:none;
    font-weight:bold;
}

.register a:hover{
    text-decoration:underline;
}

/* Mobile */

@media(max-width:480px){

    .container{
        padding:25px;
    }

    .container h1{
        font-size:28px;
    }
}

</style>
</head>
<body>

<div class="container">

    <h1>Login</h1>

    <form action="comany.html" method="post">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Remember Me</label>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register page.html">Register Now</a>
    </div>

</div>

</body>
</html>
