<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Car Expo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("img 1.jpg");
    background-size:cover;
    background-position:center;
}

/* Register Card */

.container{
    width:90%;
    max-width:450px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:white;
}

.container h1{
    text-align:center;
    margin-bottom:25px;
    color:#4CAF50;
}

/* Inputs */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
}

/* Checkbox */

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin:15px 0;
}

/* Button */

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#45a049;
}

/* Login Link */

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#4CAF50;
    text-decoration:none;
    font-weight:bold;
}

/* Mobile */

@media(max-width:480px){

    .container{
        padding:25px;
    }

    .container h1{
        font-size:28px;
    }
}

</style>
</head>
<body>

<form class="container" action="login page.html" method="post">

    <h1>Register</h1>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required>
    </div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
    </div>

    <div class="checkbox">
        <input type="checkbox" id="terms" required>
        <label for="terms">I accept all Terms & Conditions</label>
    </div>

    <button type="submit" class="btn">
        Register Now
    </button>

    <div class="login-link">
        Already have an account?
        <a href="login page.html">Login Now</a>
    </div>

</form>

</body>
</html>
